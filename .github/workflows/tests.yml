name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest-api:
    name: Pytest API code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run lint
        run: make lint

      - name: Run format check
        run: make format-check

      - name: Run tests
        run: make test

  trivy-image-scan:
    name: Trivy image vulnerabilities scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
       - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/doyonm/customer-churn-mlops-service
          tags: |
            type=sha,prefix=sha-,format=short
    
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract SHA image tag
        id: image
        run: |
          echo "sha_tag=$(echo '${{ steps.meta.outputs.tags }}' | grep ':sha-')" >> "$GITHUB_OUTPUT"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.sha_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  docker-smoke-tests:
    name: Docker smoke tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test image build
        run: make docker-build

      - name: Run image
        run: make docker-run

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API did not become ready"
          docker logs churn-api
          exit 1

      - name: Test predict endpoint
        run: |
          curl -X 'POST' \
            'http://localhost:8000/predict' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{
            "gender": "Female",
            "SeniorCitizen": 0,
            "Partner": "Yes",
            "Dependents": "No",
            "tenure": 1,
            "PhoneService": "No",
            "MultipleLines": "No phone service",
            "InternetService": "DSL",
            "OnlineSecurity": "No",
            "OnlineBackup": "Yes",
            "DeviceProtection": "No",
            "TechSupport": "No",
            "StreamingTV": "No",
            "StreamingMovies": "No",
            "Contract": "Month-to-month",
            "PaperlessBilling": "Yes",
            "PaymentMethod": "Electronic check",
            "MonthlyCharges": 29.85,
            "TotalCharges": 29.85
          }'

      - name: Print logs on failure
        if: failure()
        run: docker logs churn-api

      - name: Cleanup
        if: always()
        run: docker rm -f churn-api

  Infra:
    name: Infra code validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
      
      - name: Validate Terraform config
        run : make tf-check
  python-dependencies-vuln-check:
    name: Scan Python dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Scan Python dependencies
        run: |
          pip-audit --requirement requirements.txt

